# ITCS355 Lab 4 — continuous deployment.
#
# Runs only on main, only after CI is green. Credentials come from GCP Workload Identity
# Federation — no long-lived key is stored anywhere. ci.yml's `build` job already pushed
# the SHA-tagged serving image on this same commit (main-only push step); this workflow
# only resolves that digest, deploys it to a staging-only Cloud Run service, and smoke
# tests it. It never touches the production service Lab 3 deployed and tore down.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  STAGING_ENDPOINT: itcs355-predict-staging
  # Lab 2's registered model, same one Lab 3's production deploy used.
  MODEL_REF: projects/126202218664/locations/asia-southeast1/models/437231793901404160@production

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve pushed image digest
        id: image
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          DIGEST=$(gcloud artifacts docker images describe \
            "${CONTAINER_REGISTRY}/itcs355-serve:${SHA}" \
            --format="value(image_summary.digest)")
          IMAGE_URI="${CONTAINER_REGISTRY}/itcs355-serve@${DIGEST}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "resolved: $IMAGE_URI"

      - name: Deploy to staging
        # adapter.deploy(model_ref, endpoint, instance, image_uri=..., lab=4). lab=4
        # labels this Cloud Run service separately from Lab 3's production service, so
        # `make teardown LAB=4` can find and delete it without touching Lab 3/5's
        # resources (cloudlayer/gcp.py:_service_manifest).
        env:
          CLOUD_PROVIDER: gcp
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          TRAINING_SERVICE_ACCOUNT: ${{ vars.TRAINING_SERVICE_ACCOUNT }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          python -c "
          from src import config
          from cloudlayer.factory import get_adapter
          import os
          adapter = get_adapter(config.load(strict=False))
          name = adapter.deploy(
              os.environ['MODEL_REF'], os.environ['STAGING_ENDPOINT'], '1-512Mi',
              image_uri=os.environ['IMAGE_URI'], max_instances=2, lab=4,
          )
          print(f'deployed: {name} -> {adapter.service_url(name)}')
          "

      - name: DEBUG token diagnostics
        run: |
          echo "== tier1: ADC fetch_id_token =="
          python3 -c "
          import google.auth.transport.requests
          import google.oauth2.id_token
          try:
              auth_request = google.auth.transport.requests.Request()
              tok = google.oauth2.id_token.fetch_id_token(auth_request, 'https://itcs355-predict-staging-gpitnozf7q-as.a.run.app')
              print('tier1 SUCCESS, token length:', len(tok))
          except Exception as exc:
              print('tier1 FAILED:', type(exc).__name__, exc)
          "
          echo "== tier3: impersonate deploy SA explicitly =="
          gcloud auth print-identity-token --impersonate-service-account=itcs355-lab4-deploy@itcs355-6688033.iam.gserviceaccount.com --audiences=https://itcs355-predict-staging-gpitnozf7q-as.a.run.app || true

      - name: Smoke test
        # Three known payloads (single valid, batch valid, invalid -> 422), asserting
        # model_version on every successful response. A deploy that is not smoke-tested
        # is a deploy you have not verified. scripts/smoke_test.py calls config.load()
        # strict, so all nine capability slots must be present even though this script
        # only exercises CLOUD_PROVIDER/PROJECT_ID/REGION/TRAINING_SERVICE_ACCOUNT —
        # none of the rest are secret, they're the same values committed in
        # cloud.env.example and visible throughout reports/*.md already.
        env:
          CLOUD_PROVIDER: gcp
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          BLOB_URI: ${{ vars.BLOB_URI }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
          IDENTITY_REF: ${{ vars.IDENTITY_REF }}
          TRAINING_SERVICE_ACCOUNT: ${{ vars.TRAINING_SERVICE_ACCOUNT }}
        run: python scripts/smoke_test.py --endpoint-name "${{ env.STAGING_ENDPOINT }}"
