# ITCS355 Lab 4 — continuous integration.
#
# The sequence matters: cheap checks first, so a schema mistake fails in 30 seconds
# rather than after a build. Deploy is in cd.yml and runs only on main, only on green.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # required for OIDC. See cd.yml — no long-lived keys anywhere.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # requirements.txt is fully hash-pinned (pip-compile --generate-hashes); verified
        # locally that `pip install --require-hashes -r requirements.txt` installs clean.
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Lint
        # ruff is pinned in requirements.txt and installed above. Installing it unpinned
        # here would let a new ruff release fail this build on unchanged code.
        run: ruff check src/ service/ monitoring/ scripts/ tests/

      - name: Portability audit
        run: python scripts/portability_audit.py

      - name: Generate dataset
        run: python scripts/make_dataset.py

      - name: Unit tests
        # Fast, no network, no model fit — src/data.py helpers and monitoring/drift.py's
        # PSI/KS math. Runs before data contract tests because it is cheaper still.
        run: pytest -q tests/test_unit.py

      - name: Data contract tests
        run: pytest -q tests/test_data.py

      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py

      - name: Service tests
        run: pytest -q tests/test_service.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The integration test below runs make_dataset/train/export on the runner to
      # produce the artefact the serving container is then asked to serve, so this job
      # needs the same interpreter and pins as the test job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t itcs355:${{ github.sha }} --load .

      - name: Build serving image
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${{ github.sha }} --load .

      - name: Integration test
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib
          docker run -d --rm --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION=${{ github.sha }} \
            itcs355-serve:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf localhost:8080/ready && break || sleep 2
          done
          curl -sf -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}' \
            | tee /dev/stderr \
            | jq -e --arg sha "${{ github.sha }}" '
                (.prediction | type) == "number" and
                (.probability | type) == "number" and (.probability >= 0) and (.probability <= 1) and
                (.request_id | type) == "string" and
                .model_version == $sha
              '
          docker stop svc

      # Images are tagged with the commit SHA, never `latest`. A `latest` tag makes it
      # impossible to say which code is serving, which is the question you will be asked
      # during an incident.

      - name: Authenticate to GCP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Push serving image (main only)
        # Only reached on green, on main — a PR run never pushes an image. Reuses
        # GcpAdapter.push_image(), which runs `gcloud auth configure-docker` then
        # `docker push` and returns the digest-pinned reference, never a floating tag.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        env:
          CLOUD_PROVIDER: gcp
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
        run: |
          DIGEST=$(python -c "
          from src import config
          from cloudlayer.factory import get_adapter
          print(get_adapter(config.load(strict=False)).push_image('itcs355-serve:${{ github.sha }}'))
          ")
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

          # Also push the training image -- Task 5's scheduled drift Cloud Run Job
          # reuses it (same pinned deps, monitoring/ now included) with its
          # ENTRYPOINT/CMD overridden at job-creation time, rather than keeping a
          # second Dockerfile in sync.
          TRAIN_DIGEST=$(python -c "
          from src import config
          from cloudlayer.factory import get_adapter
          print(get_adapter(config.load(strict=False)).push_image('itcs355:${{ github.sha }}'))
          ")
          echo "train_image_digest=$TRAIN_DIGEST" >> "$GITHUB_OUTPUT"
          echo "\`$TRAIN_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
